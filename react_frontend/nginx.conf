server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router gibi client-side yönlendirmeler için tüm istekleri index.html'e yönlendir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlıkları (js, css, resimler) verimli bir şekilde cache'le.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}