version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: todolist_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Localpass.
      MYSQL_DATABASE: todolist
      MYSQL_USER: todolist_user
      MYSQL_PASSWORD: Localpass.
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - todolist_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10

  # Go Backend API
  backend:
    build:
      context: ./go_backend
      dockerfile: Dockerfile
    container_name: todolist_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=todolist_user
      - DB_PASSWORD=Localpass.
      - DB_NAME=todolist
      - JWT_SECRET=jwtsecretkey
      - CORS_ALLOW_ORIGINS=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todolist_network

  # React Frontend
  frontend:
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080
    container_name: todolist_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - todolist_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: todolist_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - todolist_network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: todolist_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - todolist_network

  # Blackbox Exporter for Frontend Monitoring
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: todolist_blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/config/blackbox.yml:ro
    command:
      - '--config.file=/config/blackbox.yml'
    networks:
      - todolist_network

  # MySQL Exporter for Database Monitoring
  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    container_name: todolist_mysqld_exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/exporter.cnf:/etc/mysqld_exporter/exporter.cnf # Yerel dosyayı konteynere bağlar
    command: --config.my-cnf=/etc/mysqld_exporter/exporter.cnf # Exporter'a hangi dosyayı okuyacağını söyler
    ports:
      - "9104:9104"
    depends_on:
      - mysql
    networks:
      - todolist_network

  # Node Exporter for System Metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: todolist_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - todolist_network

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  todolist_network:
    driver: bridge
