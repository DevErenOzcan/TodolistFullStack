version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: todolist_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Localpass.
      MYSQL_DATABASE: todolist
      MYSQL_USER: todolist_user
      MYSQL_PASSWORD: Localpass.
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - todolist_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10

  # Go Backend API
  backend:
    build:
      context: ./go_backend
      dockerfile: Dockerfile
    container_name: todolist_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=todolist_user
      - DB_PASSWORD=Localpass.
      - DB_NAME=todolist
      - JWT_SECRET=jwtsecretkey
      - CORS_ALLOW_ORIGINS=http://127.0.0.1:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todolist_network

  # React Frontend
  frontend:
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://127.0.0.1:8080
    container_name: todolist_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - todolist_network

volumes:
  mysql_data:

networks:
  todolist_network:
    driver: bridge

