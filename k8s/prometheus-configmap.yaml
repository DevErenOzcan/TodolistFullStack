apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: todolist
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus-service:9090']
        metrics_path: '/prometheus/metrics'

      - job_name: 'todolist-backend'
        static_configs:
          - targets: ['go-api-service:8080']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # Frontend monitoring via Blackbox Exporter
      - job_name: 'todolist-frontend-blackbox'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - http://react-app-service:80
            - http://react-app-service:80/login
            - http://react-app-service:80/todos
            - http://react-app-service:80/steps
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-service:9115

      # Blackbox Exporter self-monitoring
      - job_name: 'blackbox-exporter'
        static_configs:
          - targets: ['blackbox-exporter-service:9115']

      - job_name: 'mysql-exporter'
        static_configs:
          - targets: ['mysql-exporter-service:9104']

      # Node Exporter for System Metrics
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter-service:9100']
