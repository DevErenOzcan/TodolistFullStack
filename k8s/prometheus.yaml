apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: todolist
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus-service:9090']
        metrics_path: '/prometheus/metrics'

      - job_name: 'todolist-backend'
        static_configs:
          - targets: ['go-api-service:8080']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # Frontend monitoring via Blackbox Exporter
      - job_name: 'todolist-frontend-blackbox'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - https://react-app-service:80
            - https://react-app-service:80/login
            - https://react-app-service:80/todos
            - https://react-app-service:80/steps
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-service:9115

      # Blackbox Exporter self-monitoring
      - job_name: 'blackbox-exporter'
        static_configs:
          - targets: ['blackbox-exporter-service:9115']

      - job_name: 'mysql-exporter'
        static_configs:
          - targets: ['mysql-exporter-service:9104']

      # Node Exporter for System Metrics
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter-service:9100']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: todolist
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus/'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time=200h'
            - '--web.enable-lifecycle'
            - '--web.external-url=https://todolist.kubernetes.local/prometheus'
            - '--web.route-prefix=/prometheus'
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/
            - name: prometheus-storage-volume
              mountPath: /prometheus/
          resources:
            requests:
              cpu: 200m
              memory: 1000Mi
            limits:
              cpu: 1000m
              memory: 2000Mi
      volumes:
        - name: prometheus-config-volume
          configMap:
            defaultMode: 420
            name: prometheus-config
        - name: prometheus-storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: todolist
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: prometheus
