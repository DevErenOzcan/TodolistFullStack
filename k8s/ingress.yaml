apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist-ingress
  namespace: todolist
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: todolist.kubernetes.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: go-api-service
                port:
                  number: 8080

          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090

          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000

          - path: /analytics
            pathType: Prefix
            backend:
              service:
                name: flask-analytics-service
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-app-service
                port:
                  number: 80

