apiVersion: v1
kind: Secret
metadata:
  name: mysql-exporter-secret
  namespace: todolist
type: Opaque
data:
  # DATABASE_URL: mysql://todolist_user:todolist_password@mysql-service:3306/todolist_db
  DATABASE_URL: bXlzcWw6Ly90b2RvbGlzdF91c2VyOnRvZG9saXN0X3Bhc3N3b3JkQG15c3FsLXNlcnZpY2U6MzMwNi90b2RvbGlzdF9kYg==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter-deployment
  namespace: todolist
  labels:
    app: mysql-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exporter
  template:
    metadata:
      labels:
        app: mysql-exporter
    spec:
      containers:
      - name: mysql-exporter
        image: prom/mysqld-exporter:latest
        ports:
        - containerPort: 9104
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-exporter-secret
              key: DATABASE_URL
        args:
          - "--mysqld.username=todolist_user"
          - "--mysqld.address=mysql-service:3306"
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        livenessProbe:
          httpGet:
            path: /
            port: 9104
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9104
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter-service
  namespace: todolist
  labels:
    app: mysql-exporter
spec:
  selector:
    app: mysql-exporter
  ports:
  - name: metrics
    port: 9104
    targetPort: 9104
  type: ClusterIP

