apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter-deployment
  namespace: todolist
  labels:
    app: mysql-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exporter
  template:
    metadata:
      labels:
        app: mysql-exporter
    spec:
      containers:
      - name: mysql-exporter
        image: prom/mysqld-exporter:latest
        ports:
        - containerPort: 9104
        args:
          - "--config.my-cnf=/etc/mysql-exporter/exporter.cnf"
        volumeMounts:
        - name: mysql-exporter-config
          mountPath: /etc/mysql-exporter
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        livenessProbe:
          httpGet:
            path: /
            port: 9104
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 9104
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: mysql-exporter-config
        configMap:
          name: mysql-exporter-config
