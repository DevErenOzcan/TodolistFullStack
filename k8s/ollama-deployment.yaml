apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: todolist
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
          name: http
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: OLLAMA_MODEL
          value: "qwen3:latest"
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "Waiting for ollama daemon..."
                until OLLAMA_HOST=127.0.0.1 ollama list >/dev/null 2>&1; do sleep 2; done
                echo "Pulling model ${OLLAMA_MODEL}..."
                OLLAMA_HOST=127.0.0.1 ollama pull "${OLLAMA_MODEL}" || exit 1
                echo "Model pull completed."
        startupProbe:
          httpGet:
            path: /api/tags
            port: 11434
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              OLLAMA_HOST=127.0.0.1 ollama list | grep -F "${OLLAMA_MODEL}" >/dev/null
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
